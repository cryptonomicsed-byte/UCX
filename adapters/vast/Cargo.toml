[package]
name        = "ucx-adapter-vast"
version     = "0.1.0"
edition     = "2021"
description = "UCX external provider adapter for Vast.ai (GPU rental marketplace)."

[dependencies]
ucx-protocol = { path = "../../crates/ucx-protocol" }
serde        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
reqwest      = { version = "0.12", features = ["blocking", "json"] }
