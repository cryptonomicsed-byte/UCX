[workspace]
members = [
    "crates/ucx-protocol",
    "crates/ucx-broker",
    "crates/ucx-provider",
    "adapters/gpu-ai",
    "adapters/akash",
    "adapters/vast",
    "adapters/runpod",
]
resolver = "2"

[workspace.dependencies]
serde       = { version = "1",  features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1",  features = ["v4", "serde"] }
thiserror   = "1"
sha2        = "0.10"
hex         = "0.4"
chrono      = { version = "0.4", features = ["serde"] }
tracing     = "0.1"
